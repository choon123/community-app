<!DOCTYPE html>
<html>
<head>
    <title>Jobs</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h2>💼 Available Jobs</h2>

    <!-- SEARCH -->
    <form method="GET">
        <input type="text" name="search" placeholder="Search job">
        <input type="text" name="location" placeholder="Location">
        <button type="submit">Search</button>
    </form>

    <br>

    {% for job in jobs %}
        <div class="card">
            <h3>{{ job[1] }}</h3>

            <p>📍 {{ job[2] }}</p>
            <p>📞 {{ job[3] }}</p>
            <p>💰 {{ job[4] }}</p>
            <p>👷 {{ job[5] }}</p>
            <p>🍛 {{ job[6] }}</p>
            <p>{{ job[7] }}</p>

            {% if 'user' in session %}
            <a href="/save/{{ job[0] }}" class="btn">❤️ Save</a>
            {% endif %}
        </div>
    {% endfor %}

    <br>
    <a href="/">⬅ Back</a>

</div>

</body>
</html>
